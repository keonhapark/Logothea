server:
  port: 8082

spring:
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/earning_whisperer?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

jwt:
  # 운영 환경에서는 반드시 환경변수로 주입. 최소 32자(256-bit) 이상.
  secret: ${JWT_SECRET:earning-whisperer-dev-secret-key-minimum-32-chars}
  expiration-ms: 900000  # 15분 (ms)
  refresh-expiration-seconds: 604800  # 7일 (s)
  cookie-secure: ${JWT_COOKIE_SECURE:false}  # 운영: true (HTTPS only)
  # 환경별 issuer/audience 로 토큰 교차 통용 차단. 환경마다 다르게 주입 권장.
  issuer: ${JWT_ISSUER:earning-whisperer}
  audience: ${JWT_AUDIENCE:earning-whisperer-api}

oauth:
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    allowed-redirect-uris: ${GOOGLE_REDIRECT_URIS:http://localhost:3000/auth/callback}
  kakao:
    client-id: ${KAKAO_CLIENT_ID:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    allowed-redirect-uris: ${KAKAO_REDIRECT_URIS:http://localhost:3000/auth/callback}

finnhub:
  base-url: https://finnhub.io/api/v1
  api-key: ${FINNHUB_API_KEY:}   # 미설정 시 어닝 일정 스케줄러 비활성화
  ws-keys:                        # 키당 50심볼 구독. 추가 키 = 다음 50개 자동 커버
    - ${FINNHUB_API_KEY:}         # WS 1번 키 (기본: REST 키와 동일)

fmp:
  base-url: https://financialmodelingprep.com
  api-key: ${FMP_API_KEY:}       # 미설정 시 S&P 500 분기 동기화 스케줄러 비활성화

ai-engine:
  # 실시간 어닝콜 팩트체크 (Contract 9). 같은 인스턴스에 올릴 경우 localhost.
  base-url: ${AI_ENGINE_BASE_URL:http://localhost:8000}
  # false 로 두면 AI Engine 호출 없이 트랜스크립트 재생만 수행한다.
  fact-check-enabled: ${AI_ENGINE_FACT_CHECK_ENABLED:true}
  # 어닝콜 종료 후 종합 판단(Contract 4.7). false 면 재생과 팩트체크만 돈다.
  summary-enabled: ${AI_ENGINE_SUMMARY_ENABLED:true}
  # 읽기 타임아웃. AI Engine 내부 예산(추출 + 검증 타임아웃)보다 커야 한다.
  # 이 값이 더 짧으면 AI Engine 이 아직 작업 중인데 백엔드가 먼저 포기해서
  # 팩트체크가 조용히 사라진다. AI Engine 기본값 합(5+8초)과 시연 권장값(20+25초)
  # 사이에서, 시연 설정을 기준으로 잡는다.
  timeout-ms: ${AI_ENGINE_TIMEOUT_MS:50000}
  # 자막 한국어 번역(Contract 9.10). false 면 번역 요청과 발행을 하지 않는다.
  translation-enabled: ${AI_ENGINE_TRANSLATION_ENABLED:true}
  # 번역 호출 읽기 타임아웃. 번역은 한 줄로 차례로 부르므로 공용 timeout-ms 보다 짧게 둔다.
  translation-timeout-ms: ${AI_ENGINE_TRANSLATION_TIMEOUT_MS:15000}
  # 같은 요청의 AI 응답(팩트체크 · 대조 · 번역 · 종합 판단)을 기억해 다시 쓴다. 반복 방송에서 Gemini 호출을 첫 회차로 줄인다.
  response-memo-enabled: ${AI_ENGINE_RESPONSE_MEMO_ENABLED:false}

# 자막 번역 묶음 단위 (TranscriptTranslationService). 분당 Gemini 호출 수를 줄이려고 묶는다.
transcript-translation:
  batch-max-segments: ${TRANSCRIPT_TRANSLATION_BATCH_MAX_SEGMENTS:3}
  batch-max-chars: ${TRANSCRIPT_TRANSLATION_BATCH_MAX_CHARS:1200}
  # 묶음의 첫 세그먼트가 들어온 뒤 이 시간이 지나면 덜 찼어도 보낸다.
  batch-max-wait-ms: ${TRANSCRIPT_TRANSLATION_BATCH_MAX_WAIT_MS:10000}
  # 대기열에 들어간 뒤 이보다 오래 밀린 묶음은 보내지 않고 버린다.
  max-age-ms: ${TRANSCRIPT_TRANSLATION_MAX_AGE_MS:30000}

demo:
  earnings-call:
    # 시연용 어닝콜 스크립트. classpath 기준 경로.
    script-path: ${DEMO_SCRIPT_PATH:data/demo-earnings-call.json}
    # 세그먼트 발행 간격. 시연 길이는 세그먼트 수 x 이 값이다.
    interval-ms: ${DEMO_SEGMENT_INTERVAL_MS:6000}
    loop:
      # 전시용 반복 방송. 켜면 기동 직후부터 재생 → 종합 판단 → 쉬기 → 새 회차 재생을 계속한다.
      enabled: ${DEMO_LOOP_ENABLED:false}
      # 반복할 종목. 비우면 스크립트 기본 종목.
      ticker: ${DEMO_LOOP_TICKER:}
      # 재생이 끝난 뒤 다음 회차까지 쉬는 시간. 종합 판단이 나올 시간을 포함한다.
      pause-ms: ${DEMO_LOOP_PAUSE_MS:180000}

app:
  internal:
    # Data Pipeline → Backend 내부 엔드포인트(/api/v1/internal/**) 공유 시크릿.
    # 운영/배포 환경에서는 반드시 환경변수 INTERNAL_SECRET 으로 주입.
    # 미설정(빈 문자열) 시 InternalSecretFilter 가 모든 internal 요청을 401 로 차단한다.
    secret: ${INTERNAL_SECRET:}

  cors:
    # 콤마 구분 origin 목록. 운영 도메인 / vercel 프리뷰 패턴을 환경변수 CORS_ALLOWED_ORIGINS 로 주입.
    # 정확한 origin (스킴+호스트+포트) 또는 와일드카드 패턴 (예: https://*-keonha123.vercel.app) 모두 허용.
    # 미설정 시 dev 로컬 호스트(3000/5173) 만 허용.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
    # 쿠키 없이 Bearer 토큰만 쓰는 출처(전시용 웹). allowCredentials=false 로 따로 허용한다.
    guest-origins: ${CORS_GUEST_ORIGINS:}

  live-analysis:
    # data_pipeline 실시간 인입 자막에도 팩트체크 · 직전 콜 대조 · 종합 판단을 요청할지. 끄면 자막과 번역만 나간다.
    # 기본 꺼짐. 1시간 콜이면 세그먼트(약 10초) 수백 건만큼 AI Engine 호출이 생겨 무료 등급 한도를 시연 전에 쓸 수 있다.
    enabled: ${LIVE_ANALYSIS_ENABLED:false}
    # 종료 신호 없이 이 시간 동안 자막이 없으면 회차를 정리한다(종합 판단 없음).
    idle-timeout-minutes: ${LIVE_ANALYSIS_IDLE_TIMEOUT_MINUTES:30}

  assistant:
    # 질의응답(#112)이 근거로 쓰는 콜 단위 세그먼트 기록의 보관 시간. 마지막 세그먼트 기준으로 갱신된다.
    segment-ttl-hours: ${ASSISTANT_SEGMENT_TTL_HOURS:48}
    # logothea-assistant 주소. 같은 인스턴스의 루프백에만 바인딩된다.
    base-url: ${ASSISTANT_BASE_URL:http://127.0.0.1:8100}
    # 사용자별 하루 질문 수(Asia/Seoul 날짜 기준). 질문을 시작할 때 차감한다.
    daily-limit: ${ASSISTANT_DAILY_LIMIT:50}
    # 답변 스트림 전체 상한(초). 넘으면 error 이벤트를 보내고 assistant 연결을 닫는다.
    stream-timeout-seconds: ${ASSISTANT_STREAM_TIMEOUT_SECONDS:60}

  guest:
    # 전시용 웹(demo.logothea.com) 게스트 토큰 발급. 끄면 POST /api/v1/guest/token 이 404.
    enabled: ${GUEST_ENABLED:false}
    # 게스트 토큰 수명(초). 만료되면 웹이 다시 발급받는다.
    token-ttl-seconds: ${GUEST_TOKEN_TTL_SECONDS:3600}
    # 클라이언트 IP(CF-Connecting-IP) 하나당 1분 발급 수. 전시장은 관람객이 같은 IP 를 쓸 수 있다.
    issue-per-minute: ${GUEST_ISSUE_PER_MINUTE:20}
    # 게스트 토큰 하나당 질의응답 수.
    assistant-per-guest: ${GUEST_ASSISTANT_PER_GUEST:5}
    # 모든 게스트를 합친 하루 질의응답 수(Asia/Seoul 날짜). LLM 비용 상한.
    assistant-daily-total: ${GUEST_ASSISTANT_DAILY_TOTAL:500}

  trade:
    # 수동 주문 PENDING 의 유효시간(초). 증권사에 실제로 들어가 체결을 기다리는
    # 주문이므로 이 시간이 지나면 scheduler 가 EXPIRED 로 전환한다.
    # KIS 당일 주문은 장 마감 시 취소되므로 하루를 기본값으로 둔다.
    manual-pending-ttl-seconds: ${TRADE_MANUAL_PENDING_TTL_SECONDS:86400}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
